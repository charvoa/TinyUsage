<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">TinyUsage: private Mac to iPhone usage companion</title>
  <desc id="desc">Provider data and local logs are collected on a Mac, normalized locally, then synchronized to an iPhone over an encrypted local connection.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111323"/><stop offset=".55" stop-color="#1c1740"/><stop offset="1" stop-color="#32205a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff8dbb"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="collector" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff83b7"/><stop offset="1" stop-color="#967cf3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#070812" flood-opacity=".45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1400" height="620" rx="38" fill="url(#canvas)"/>
  <circle cx="1120" cy="34" r="170" fill="#a78bfa" opacity=".13" filter="url(#glow)"/>
  <circle cx="170" cy="600" r="180" fill="#ff8dbb" opacity=".08" filter="url(#glow)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif" fill="#fff">
    <text x="72" y="78" font-size="18" font-weight="700" letter-spacing="3" fill="#ffc5de">TINYUSAGE</text>
    <text x="72" y="134" font-size="43" font-weight="760" letter-spacing="-1.4">Your AI limits. In your pocket.</text>
    <text x="74" y="170" font-size="19" fill="#bdb9d2">Private collection on Mac · simple snapshots on iPhone</text>
  </g>

  <!-- source card -->
  <g filter="url(#shadow)">
    <rect x="70" y="238" width="335" height="270" rx="28" fill="#211d3b" stroke="#4f4772" stroke-width="2"/>
    <rect x="70" y="238" width="8" height="270" rx="4" fill="#a78bfa"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif">
    <g transform="translate(105 275)">
      <rect width="54" height="54" rx="16" fill="#3b3163"/>
      <path d="M14 36h27M18 36V20h19v16M14 20h27M23 15h9" fill="none" stroke="#d9ccff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="180" y="301" fill="#fff" font-size="23" font-weight="700">Your sources</text>
    <text x="180" y="328" fill="#aaa5c1" font-size="15">Credentials stay on Mac</text>
    <g fill="#e8e4f6" font-size="17">
      <text x="108" y="382">Claude + Codex APIs</text>
      <text x="108" y="420">CLI session logs</text>
      <text x="108" y="458">Mac Keychain</text>
    </g>
    <circle cx="96" cy="376" r="4" fill="#ff9fc5"/><circle cx="96" cy="414" r="4" fill="#ff9fc5"/><circle cx="96" cy="452" r="4" fill="#ff9fc5"/>
  </g>

  <!-- collector card -->
  <g filter="url(#shadow)">
    <rect x="510" y="208" width="380" height="330" rx="32" fill="url(#collector)"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif">
    <g transform="translate(550 250)">
      <circle cx="30" cy="30" r="30" fill="#241942" opacity=".32"/>
      <path d="M17 39V21h26v18M13 21h34M21 16h14M23 28h14M23 34h9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="635" y="284" fill="#24183f" font-size="25" font-weight="750">Mac Collector</text>
    <text x="550" y="355" fill="#24183f" font-size="18" font-weight="650">Collect · normalize · cache</text>
    <g fill="#33224f" font-size="16">
      <text x="550" y="397">One local source of truth</text>
      <text x="550" y="431">Bonjour + encrypted PSK</text>
      <text x="550" y="465">No backend · no telemetry</text>
    </g>
    <rect x="550" y="492" width="190" height="2" rx="1" fill="#fff" opacity=".35"/>
    <text x="550" y="518" fill="#24183f" font-size="14" font-weight="650">Only normalized snapshots leave</text>
  </g>

  <!-- phone card -->
  <g filter="url(#shadow)">
    <rect x="995" y="190" width="325" height="360" rx="34" fill="#f8f7ff"/>
    <rect x="1011" y="206" width="293" height="328" rx="24" fill="#efedf8"/>
    <rect x="1118" y="216" width="78" height="6" rx="3" fill="#c4bfd4"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif" fill="#24183f">
    <text x="1042" y="275" font-size="23" font-weight="750">iPhone companion</text>
    <text x="1042" y="306" font-size="15" fill="#746c8f">Your glanceable view</text>
    <rect x="1042" y="342" width="231" height="54" rx="16" fill="#fff"/>
    <circle cx="1070" cy="369" r="14" fill="#ffb169"/><text x="1095" y="375" font-size="16" font-weight="650">Dashboard</text>
    <rect x="1042" y="409" width="231" height="54" rx="16" fill="#fff"/>
    <circle cx="1070" cy="436" r="14" fill="#a78bfa"/><text x="1095" y="442" font-size="16" font-weight="650">Widget</text>
    <rect x="1042" y="476" width="231" height="38" rx="12" fill="#24183f"/>
    <text x="1061" y="501" font-size="14" font-weight="650" fill="#fff">One Live Activity</text>
  </g>

  <!-- transport arrows -->
  <g fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round">
    <path d="M421 373h69"/><path d="M906 373h69"/>
  </g>
  <g fill="#ffb1ce"><path d="m494 373-14-10v20z"/><path d="m979 373-14-10v20z"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif" fill="#9f99b8" font-size="13" text-anchor="middle">
    <text x="455" y="349">local network</text><text x="940" y="349">snapshot sync</text>
  </g>
</svg>
