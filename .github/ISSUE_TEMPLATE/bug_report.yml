name: Bug report
description: Report a reproducible problem without sharing secrets.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include credentials, tokens, cookies, raw provider responses, account emails or home-directory paths.
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: main / commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment
      placeholder: macOS version, iOS version, Xcode version, simulator or device
    validations:
      required: true
